# Dependency (SCA) security-scan steps (doc/SecurityScan.md). Non-blocking by
# design: it runs `security-audit.mjs --no-fail` and publishes the JSON report for
# triage. It is wired only into the scheduled Security_Scan stage, never the PR gate.
steps:
  - task: NodeTool@0
    displayName: Install Node
    inputs:
      versionSpec: $(nodeVersion)
  - script: yarn install --frozen-lockfile
    displayName: yarn install
  - script: node scripts/security-audit.mjs --no-fail
    displayName: Dependency audit (yarn audit)
  - task: PublishBuildArtifacts@1
    displayName: Publish security report
    condition: always()
    inputs:
      pathToPublish: security/audit-report.json
      artifactName: Security_Report
